interface:
  display_name: "Generate 2D Sprite"
  short_description: "Game-ready sprites from generated art: masters, sheets, clips, exports."
  default_prompt: "Use $generate2dsprite to plan game-size art, generate it through route_media (the API when a key is configured, else the local Codex or Grok CLI), approve one master still per character and hand its animation to video2dsprite (one clip per action); use sheets only for FX, icons and props, finish HD by default and deliver reviewed frames, clips and engine exports."
