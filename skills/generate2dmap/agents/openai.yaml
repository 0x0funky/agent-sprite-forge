interface:
  display_name: "Generate 2D Map"
  short_description: "Playable maps, layered scenery and animated environments"
  default_prompt: "Use $generate2dmap to build a scene matching my game; plan navigation and camera first, generate tiles, props and painted scenery through route_media (the API when a key is configured, else the local Codex or Grok CLI), write the map data, then validate placement, collision, reachability and requested motion and export it."

policy:
  allow_implicit_invocation: true
