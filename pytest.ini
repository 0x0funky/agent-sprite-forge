[pytest]
minversion = 8.0
testpaths = tests
# pytest's defaults are repeated because setting norecursedirs replaces them.
norecursedirs = .* *.egg _darcs build CVS dist node_modules venv {arch} tests/benchmarks tests/fixtures tests/js
addopts = -m "not bench"
markers =
    perf: generous performance budgets; part of the full local suite
    bench: opt-in local benchmark on real clips (reads FORGE_BENCH_CLIP); excluded by default, run with -m bench
    ffmpeg: needs ffmpeg and ffprobe on PATH; skipped when missing
    node: needs node on PATH; skipped when missing
    resvg: needs resvg-py; skipped when missing
    e2e: end-to-end pipeline smoke tests written during integration
