interface:
  display_name: "Generate 2D Map"
  short_description: "Playable maps, layered scenery and animated environments"
  default_prompt: "Use $generate2dmap to build a scene matching my game; plan navigation and camera first, use code art via codeart2d for tiles, autotiles and map data and the image tool for painted scenery, then validate placement, collision, reachability and requested motion and export it."

policy:
  allow_implicit_invocation: true
